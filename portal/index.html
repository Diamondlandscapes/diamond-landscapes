<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<title>Diamond Landscapes — Customer Portal</title>
<meta name="theme-color" content="#0d1117"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css"/>
<style>
  :root{
    --bg:#0d1117; --bg2:#161b22; --bg3:#1c2128; --bg4:#22272e;
    --border:#2d333b; --border2:#373e47;
    --text:#e6edf3; --text2:#adbac7; --text3:#768390; --text4:#545d68;
    --green:#3fb950; --green2:#238636; --green3:#2ea043;
    --blue:#58a6ff; --red:#f85149; --yellow:#d29922;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:20px 16px calc(24px + var(--safe-bottom)); min-height:100vh; }
  .center-wrap{ max-width:400px; margin:0 auto; padding:20px; min-height:100vh; display:flex; flex-direction:column; justify-content:center; }
  .logo{ text-align:center; margin-bottom:28px; }
  .logo-icon{ font-size:40px; margin-bottom:8px; }
  .logo-title{ font-size:20px; font-weight:800; letter-spacing:.5px; }
  .logo-sub{ font-size:13px; color:var(--text3); margin-top:4px; }
  .card{ background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px; }
  .inp{
    width:100%; background:var(--bg3); border:1px solid var(--border2); border-radius:10px;
    color:var(--text); font-size:15px; padding:13px 14px; font-family:inherit; outline:none;
  }
  .inp:focus{ border-color:var(--blue); }
  .inp:disabled{ opacity:.55; }
  textarea.inp{ resize:vertical; min-height:80px; }
  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px; border-radius:11px; border:none; cursor:pointer;
    font-size:15px; font-weight:700; font-family:inherit;
  }
  .btn-green{ background:var(--green2); color:#fff; }
  .btn-green:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-outline{ background:var(--bg3); color:var(--text2); border:1px solid var(--border2); }
  .err{ color:var(--red); font-size:13px; margin-top:10px; text-align:center; min-height:16px; }
  .stat{ flex:1; background:var(--bg3); border-radius:10px; padding:12px 14px; }
  .stat-label{ font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--text3); }
  .stat-value{ font-size:15px; font-weight:700; color:var(--text); margin-top:4px; }
  .req-card{ background:var(--bg3); border:1px solid var(--border2); border-radius:12px; padding:14px; margin-bottom:10px; }
  .badge{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:.4px; text-transform:uppercase; }
  .badge-new{ background:rgba(88,166,255,.15); color:var(--blue); }
  .badge-reviewed{ background:rgba(210,153,34,.15); color:var(--yellow); }
  .badge-resolved{ background:rgba(63,185,80,.15); color:var(--green); }
  .photo-zone{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg3); border:2px dashed var(--border2); border-radius:14px;
    padding:28px 16px; cursor:pointer; text-align:center; margin-bottom:14px;
  }
  .overlay{ position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,.7); display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ width:100%; max-width:480px; background:var(--bg2); border-radius:20px 20px 0 0; padding:20px 16px calc(20px + var(--safe-bottom)); max-height:88vh; overflow-y:auto; }
  .type-pill{ flex:1; padding:12px 8px; border-radius:10px; text-align:center; font-size:13px; font-weight:700; cursor:pointer; border:2px solid var(--border2); background:var(--bg3); color:var(--text2); }
  .type-pill.active{ border-color:var(--blue); background:rgba(88,166,255,.12); color:var(--blue); }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--bg4); border:1px solid var(--border2); color:var(--text); padding:12px 20px; border-radius:10px; font-size:13px; font-weight:600; z-index:3000; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show{ opacity:1; }
  .star{ font-size:34px; cursor:pointer; color:var(--border2); transition:color .1s; }
  .star.on{ color:var(--yellow); }
  @media (min-width:768px){ .wrap{ padding-top:32px; } }
</style>
</head>
<body>

<div id="login-screen" class="center-wrap">
  <div class="logo">
    <div class="logo-icon">💎</div>
    <div class="logo-title">DIAMOND LANDSCAPES</div>
    <div class="logo-sub">Customer Portal</div>
  </div>
  <div class="card">
    <div style="font-size:14px;font-weight:700;margin-bottom:4px;">Sign in</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:14px;">Enter the email on file for your property.</div>
    <input class="inp" id="login-email" type="email" placeholder="you@email.com" style="margin-bottom:10px;" autocomplete="email"/>
    <button class="btn btn-green" id="login-btn" onclick="portalLogin()">Continue</button>
    <div class="err" id="login-err"></div>
  </div>
  <div style="text-align:center;font-size:12px;color:var(--text4);">
    Don't have portal access yet? Contact us to get set up.
  </div>
</div>

<div id="main-screen" class="wrap" style="display:none;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <div>
      <div style="font-size:12px;color:var(--text3);font-weight:700;letter-spacing:.5px;">DIAMOND LANDSCAPES</div>
      <div style="font-size:19px;font-weight:800;margin-top:2px;" id="main-greeting"></div>
    </div>
    <button onclick="portalLogout()" style="background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;color:var(--text3);font-size:12px;font-weight:700;cursor:pointer;">Sign Out</button>
  </div>

  <button id="property-switcher-btn" onclick="openPropertySwitcher()" style="display:none;width:100%;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:10px 12px;margin-bottom:14px;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;">
    <span><i class="ti ti-home" style="margin-right:6px;color:var(--text3);"></i><span id="switcher-addr"></span></span>
    <span style="color:var(--blue);font-size:11px;" id="switcher-count"></span>
  </button>

  <div class="card" style="background:linear-gradient(135deg,var(--bg3),var(--bg2));border-color:var(--green3);">
    <div style="font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--green);text-transform:uppercase;margin-bottom:6px;">Next Service</div>
    <div style="font-size:20px;font-weight:800;" id="hero-next-date">Not scheduled</div>
    <div style="font-size:12px;color:var(--text2);margin-top:8px;" id="hero-frequency"></div>
  </div>

  <div id="last-visit-section" style="display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.5px;">YOUR YARD — LAST VISIT</div>
      <span style="font-size:11px;color:var(--blue);" id="last-visit-date"></span>
    </div>
    <img id="last-visit-photo" style="width:100%;border-radius:12px;max-height:220px;object-fit:cover;margin-bottom:16px;"/>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
    <button onclick="openNewRequestSheet('issue')" style="padding:14px 10px;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);border-radius:12px;color:var(--red);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;">
      <i class="ti ti-flag-2" style="font-size:18px;"></i>Report an issue
    </button>
    <button onclick="openNewRequestSheet('estimate')" style="padding:14px 10px;background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);border-radius:12px;color:var(--blue);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;">
      <i class="ti ti-currency-dollar" style="font-size:18px;"></i>Request estimate
    </button>
  </div>

  <div class="card" id="rating-card">
    <div style="font-size:13px;font-weight:700;margin-bottom:10px;">How was your last visit?</div>
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:6px;" id="rating-stars"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.5px;">YOUR INFO</div>
      <span onclick="openEditContactSheet()" style="font-size:11px;color:var(--blue);font-weight:700;cursor:pointer;">Edit <i class="ti ti-pencil" style="font-size:11px;"></i></span>
    </div>
    <div style="font-size:13px;color:var(--text2);line-height:1.9;">
      <div id="info-email"></div>
      <div id="info-phone"></div>
      <div id="info-address" style="color:var(--text3);font-size:12px;margin-top:4px;"></div>
    </div>
  </div>

  <div style="font-size:13px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:10px;">YOUR REQUESTS</div>
  <div id="request-history"></div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, addDoc, doc, setDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadString, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
import { getAuth, signInAnonymously }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyBYcBBQ2IFVgL4Oq0Oob54ttzxuntwdY2Q",
  authDomain:        "diamond-landscapes-f676b.firebaseapp.com",
  projectId:         "diamond-landscapes-f676b",
  storageBucket:     "diamond-landscapes-f676b.firebasestorage.app",
  messagingSenderId: "795500111307",
  appId:             "1:795500111307:web:39379296ce4d91a509824e"
};

// TODO: paste your actual Google Business review link here, e.g.
// 'https://g.page/r/XXXXXXXXXXXXXXX/review'
const GOOGLE_REVIEW_URL = 'https://share.google/sUCiCSnIQHDkyGrOM';

let fbApp, db, storage;
try { fbApp = getApp(); } catch(e) { fbApp = initializeApp(firebaseConfig); }
db = getFirestore(fbApp);
storage = getStorage(fbApp);

let myProperties = [];   // every property matching this email
let currentProp = null;  // the one currently being viewed
let selectedType = 'issue';
let pendingPhoto = null;
let selectedRating = 0;

signInAnonymously(getAuth(fbApp)).catch(function(e){ console.warn('Auth failed:', e.message); });

window.toast = function(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
};

// ── Login ──────────────────────────────────────────────────────────────
window.portalLogin = async function() {
  var emailInput = document.getElementById('login-email');
  var errEl = document.getElementById('login-err');
  var btn = document.getElementById('login-btn');
  var email = (emailInput.value || '').trim().toLowerCase();
  errEl.textContent = '';
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errEl.textContent = 'Enter a valid email address.';
    return;
  }
  btn.disabled = true; btn.textContent = 'Checking…';
  try {
    var q = query(collection(db, 'properties'), where('email', '==', email));
    var snap = await getDocs(q);
    if (snap.empty) {
      errEl.textContent = "We couldn't find a property with that email. Contact us if this seems wrong.";
      btn.disabled = false; btn.textContent = 'Continue';
      return;
    }
    myProperties = [];
    snap.forEach(function(d){ myProperties.push(Object.assign({ id: d.id }, d.data())); });
    currentProp = myProperties[0];
    localStorage.setItem('dl_portal_email', email);
    showMainScreen();
  } catch(e) {
    console.error(e);
    errEl.textContent = 'Something went wrong — check your connection and try again.';
    btn.disabled = false; btn.textContent = 'Continue';
  }
};

window.portalLogout = function() {
  localStorage.removeItem('dl_portal_email');
  myProperties = []; currentProp = null;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-email').value = '';
};

async function tryAutoLogin() {
  var email = localStorage.getItem('dl_portal_email');
  if (!email) return;
  try {
    var snap = await getDocs(query(collection(db, 'properties'), where('email', '==', email)));
    if (snap.empty) return;
    myProperties = [];
    snap.forEach(function(d){ myProperties.push(Object.assign({ id: d.id }, d.data())); });
    currentProp = myProperties[0];
    showMainScreen();
  } catch(e) { console.warn('Auto-login failed:', e.message); }
}

// ── Property switcher (handles customers with multiple properties) ──────
window.openPropertySwitcher = function() {
  if (myProperties.length < 2) return;
  var wrap = document.createElement('div');
  wrap.className = 'overlay';
  wrap.id = 'switcher-overlay';
  wrap.innerHTML = '<div class="sheet">'
    + '<div style="font-size:16px;font-weight:800;margin-bottom:14px;">Your properties</div>'
    + myProperties.map(function(p, i) {
        return '<button onclick="switchProperty(' + i + ')" style="width:100%;text-align:left;background:' + (p.id===currentProp.id?'rgba(88,166,255,.1)':'var(--bg3)') + ';border:1px solid ' + (p.id===currentProp.id?'var(--blue)':'var(--border2)') + ';border-radius:10px;padding:12px 14px;margin-bottom:8px;color:var(--text);font-size:13px;font-weight:700;cursor:pointer;">'
          + '<i class="ti ti-home" style="margin-right:6px;color:var(--text3);"></i>' + (p.address || p.name)
        + '</button>';
      }).join('')
  + '</div>';
  wrap.addEventListener('click', function(e){ if (e.target === wrap) wrap.remove(); });
  document.body.appendChild(wrap);
};

window.switchProperty = function(idx) {
  currentProp = myProperties[idx];
  document.getElementById('switcher-overlay')?.remove();
  showMainScreen();
};

function showMainScreen() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';

  var firstName = (currentProp.name || '').split(' ')[0] || 'there';
  document.getElementById('main-greeting').textContent = 'Welcome back, ' + firstName;

  var switcherBtn = document.getElementById('property-switcher-btn');
  if (myProperties.length > 1) {
    switcherBtn.style.display = 'flex';
    document.getElementById('switcher-addr').textContent = currentProp.address || currentProp.name;
    document.getElementById('switcher-count').innerHTML = myProperties.length + ' properties <i class="ti ti-chevron-down" style="margin-left:2px;"></i>';
  } else {
    switcherBtn.style.display = 'none';
  }

  document.getElementById('hero-next-date').textContent = currentProp.nextServiceDate || 'Not scheduled yet';
  document.getElementById('hero-frequency').textContent = currentProp.frequency ? (currentProp.frequency + ' service') : '';

  document.getElementById('info-email').textContent = currentProp.email || '';
  document.getElementById('info-phone').textContent = currentProp.phone || 'No phone on file';
  document.getElementById('info-address').textContent = currentProp.address || '';

  loadLastVisitPhoto();
  loadRequestHistory();
  renderRatingStars();
}

// ── Last visit photo — pulled from the crew's completed-stop photo, not a
// separate customer-facing system, so it's always real and current. Only
// reads propId/completed/completedPhoto/completedAtISO off route stops —
// never touches crew records (those contain phone numbers and login PINs
// that have no business being in a customer-facing page).
async function loadLastVisitPhoto() {
  var section = document.getElementById('last-visit-section');
  section.style.display = 'none';
  try {
    var snap = await getDocs(collection(db, 'routes'));
    var best = null;
    snap.forEach(function(d) {
      var route = d.data();
      (route.stops || []).forEach(function(s) {
        if (s.propId === currentProp.id && s.completed && s.completedPhoto && s.completedAtISO) {
          if (!best || new Date(s.completedAtISO) > new Date(best.completedAtISO)) best = s;
        }
      });
    });
    if (best) {
      document.getElementById('last-visit-photo').src = best.completedPhoto;
      document.getElementById('last-visit-date').textContent = fmtDate(best.completedAtISO);
      section.style.display = 'block';
    }
  } catch(e) { console.warn('Could not load last visit photo:', e.message); }
}

// ── Request history ───────────────────────────────────────────────────
async function loadRequestHistory() {
  var el = document.getElementById('request-history');
  el.innerHTML = '<div style="text-align:center;color:var(--text4);font-size:13px;padding:16px;">Loading…</div>';
  try {
    var q = query(collection(db, 'customerRequests'), where('propId', '==', currentProp.id));
    var snap = await getDocs(q);
    var reqs = [];
    snap.forEach(function(d){ reqs.push(Object.assign({ id: d.id }, d.data())); });
    reqs = reqs.filter(function(r){ return r.type !== 'feedback'; }); // feedback isn't a "request", keep history focused
    reqs.sort(function(a,b){ return new Date(b.createdAt||0) - new Date(a.createdAt||0); });
    if (!reqs.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--text4);font-size:13px;padding:20px 0;">No requests yet</div>';
      return;
    }
    var typeIcons = { issue:'🚩', estimate:'💰', other:'💬' };
    var typeLabels = { issue:'Issue Report', estimate:'Estimate Request', other:'Other' };
    el.innerHTML = reqs.map(function(r) {
      return '<div class="req-card">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;">'
          + '<div style="font-weight:700;font-size:13px;">' + (typeIcons[r.type]||'💬') + ' ' + (typeLabels[r.type]||'Request') + '</div>'
          + '<span class="badge badge-' + (r.status||'new') + '">' + (r.status||'new') + '</span>'
        + '</div>'
        + '<div style="font-size:13px;color:var(--text2);margin-bottom:6px;">' + (r.description||'') + '</div>'
        + (r.photo ? '<img src="' + r.photo + '" style="width:100%;border-radius:8px;max-height:160px;object-fit:cover;margin-bottom:6px;"/>' : '')
        + '<div style="font-size:11px;color:var(--text4);">' + fmtDate(r.createdAt) + '</div>'
      + '</div>';
    }).join('');
  } catch(e) {
    console.error(e);
    el.innerHTML = '<div style="text-align:center;color:var(--red);font-size:13px;padding:16px;">Could not load request history</div>';
  }
}

function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}

// ── Star rating — gated: high ratings go to Google, low ratings stay
// private so you hear about problems before they become a public review.
function renderRatingStars() {
  var el = document.getElementById('rating-stars');
  el.innerHTML = '';
  for (var i = 1; i <= 5; i++) {
    var star = document.createElement('span');
    star.className = 'star';
    star.textContent = '★';
    star.dataset.val = i;
    star.onclick = function() { handleRatingTap(parseInt(this.dataset.val)); };
    el.appendChild(star);
  }
}

window.handleRatingTap = function(rating) {
  selectedRating = rating;
  document.querySelectorAll('#rating-stars .star').forEach(function(s) {
    s.classList.toggle('on', parseInt(s.dataset.val) <= rating);
  });
  setTimeout(function() {
    if (rating >= 4) showPositiveRatingFollowup(rating);
    else showPrivateFeedbackForm(rating);
  }, 200);
};

function showPositiveRatingFollowup(rating) {
  var wrap = document.createElement('div');
  wrap.className = 'overlay'; wrap.id = 'rating-followup-overlay';
  wrap.innerHTML = '<div class="sheet" style="text-align:center;">'
    + '<div style="font-size:40px;margin-bottom:10px;">🎉</div>'
    + '<div style="font-size:17px;font-weight:800;margin-bottom:8px;">Thanks for the ' + rating + ' stars!</div>'
    + '<div style="font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.6;">Would you mind sharing that on Google? It really helps us out.</div>'
    + (GOOGLE_REVIEW_URL
        ? '<a href="' + GOOGLE_REVIEW_URL + '" target="_blank" class="btn btn-green" style="text-decoration:none;margin-bottom:10px;">Leave a Google review</a>'
        : '<div style="font-size:12px;color:var(--yellow);margin-bottom:10px;">(Google review link not set up yet)</div>')
    + '<button class="btn btn-outline" onclick="submitRating(' + rating + ',\'\');document.getElementById(\'rating-followup-overlay\').remove();">Maybe later</button>'
  + '</div>';
  document.body.appendChild(wrap);
}

function showPrivateFeedbackForm(rating) {
  var wrap = document.createElement('div');
  wrap.className = 'overlay'; wrap.id = 'feedback-overlay';
  wrap.innerHTML = '<div class="sheet">'
    + '<div style="font-size:16px;font-weight:800;margin-bottom:6px;">Sorry to hear that</div>'
    + '<div style="font-size:13px;color:var(--text3);margin-bottom:14px;">This stays private between us — tell us what happened so we can make it right.</div>'
    + '<textarea class="inp" id="feedback-note" rows="4" placeholder="What went wrong?" style="margin-bottom:14px;"></textarea>'
    + '<button class="btn btn-green" onclick="submitRating(' + rating + ', document.getElementById(\'feedback-note\').value);document.getElementById(\'feedback-overlay\').remove();">Send feedback</button>'
  + '</div>';
  document.body.appendChild(wrap);
}

window.submitRating = async function(rating, note) {
  try {
    var email = localStorage.getItem('dl_portal_email') || '';
    await addDoc(collection(db, 'customerRequests'), {
      propId: currentProp.id, customerEmail: email,
      type: 'feedback', rating: rating, description: note || '',
      photo: '', status: rating <= 3 ? 'new' : 'resolved',
      createdAt: new Date().toISOString()
    });
    toast('✓ Thanks for letting us know');
  } catch(e) { console.error(e); }
};

// ── Edit contact info — phone only; email stays as-is since it's also the
// portal login key, changing it needs to go through us to avoid lockouts.
window.openEditContactSheet = function() {
  var wrap = document.createElement('div');
  wrap.className = 'overlay'; wrap.id = 'edit-contact-overlay';
  wrap.innerHTML = '<div class="sheet">'
    + '<div style="font-size:16px;font-weight:800;margin-bottom:14px;">Edit your info</div>'
    + '<div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:6px;">EMAIL</div>'
    + '<input class="inp" value="' + (currentProp.email||'') + '" disabled style="margin-bottom:6px;"/>'
    + '<div style="font-size:11px;color:var(--text4);margin-bottom:14px;">Contact us to change your login email.</div>'
    + '<div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:6px;">PHONE</div>'
    + '<input class="inp" id="edit-phone" type="tel" value="' + (currentProp.phone||'') + '" style="margin-bottom:16px;"/>'
    + '<button class="btn btn-green" onclick="saveContactInfo()">Save</button>'
  + '</div>';
  document.body.appendChild(wrap);
};

window.saveContactInfo = async function() {
  var phone = (document.getElementById('edit-phone').value || '').trim();
  try {
    await setDoc(doc(db, 'properties', currentProp.id), { phone: phone }, { merge: true });
    currentProp.phone = phone;
    var idx = myProperties.findIndex(function(p){ return p.id === currentProp.id; });
    if (idx > -1) myProperties[idx].phone = phone;
    document.getElementById('info-phone').textContent = phone || 'No phone on file';
    document.getElementById('edit-contact-overlay').remove();
    toast('✓ Saved');
  } catch(e) {
    console.error(e);
    toast('Could not save — try again');
  }
};

// ── New Request sheet ─────────────────────────────────────────────────
window.openNewRequestSheet = function(presetType) {
  selectedType = presetType || 'issue';
  pendingPhoto = null;
  var wrap = document.createElement('div');
  wrap.id = 'new-req-overlay';
  wrap.className = 'overlay';
  wrap.innerHTML =
    '<div class="sheet">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">'
        + '<div style="font-size:17px;font-weight:800;">New Request</div>'
        + '<button onclick="document.getElementById(\'new-req-overlay\').remove()" style="background:var(--bg3);border:1px solid var(--border2);border-radius:8px;width:28px;height:28px;color:var(--text2);cursor:pointer;">✕</button>'
      + '</div>'

      + '<div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:8px;">TYPE OF REQUEST</div>'
      + '<div style="display:flex;gap:8px;margin-bottom:16px;">'
        + '<div class="type-pill" id="type-issue" onclick="selectReqType(\'issue\')">🚩 Issue</div>'
        + '<div class="type-pill" id="type-estimate" onclick="selectReqType(\'estimate\')">💰 Estimate</div>'
        + '<div class="type-pill" id="type-other" onclick="selectReqType(\'other\')">💬 Other</div>'
      + '</div>'

      + '<div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:8px;">DESCRIBE YOUR REQUEST</div>'
      + '<textarea class="inp" id="req-description" rows="4" placeholder="Tell us what you need..." style="margin-bottom:16px;"></textarea>'

      + '<div style="font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.5px;margin-bottom:8px;">PHOTO <span style="color:var(--red);">(required)</span></div>'
      + '<label class="photo-zone" id="req-photo-zone">'
        + '<div id="req-photo-icon" style="font-size:34px;margin-bottom:6px;">📷</div>'
        + '<div id="req-photo-label" style="font-size:13px;color:var(--text3);">Tap to take or choose a photo</div>'
        + '<input type="file" id="req-photo-input" accept="image/*" style="display:none;"/>'
      + '</label>'
      + '<img id="req-photo-preview" style="display:none;width:100%;border-radius:10px;max-height:220px;object-fit:cover;margin-bottom:16px;margin-top:-6px;"/>'

      + '<div class="err" id="req-err"></div>'
      + '<button class="btn btn-green" id="req-submit-btn" onclick="submitRequest()">Submit Request</button>'
    + '</div>';
  wrap.addEventListener('click', function(e){ if (e.target === wrap) wrap.remove(); });
  document.body.appendChild(wrap);
  selectReqType(selectedType);

  document.getElementById('req-photo-input').addEventListener('change', function() {
    var file = this.files[0];
    if (!file) return;
    var icon = document.getElementById('req-photo-icon');
    var label = document.getElementById('req-photo-label');
    icon.textContent = '⏳';
    label.textContent = 'Processing photo…';
    readFileAsDataUrl(file, function(dataUrl) {
      if (!dataUrl) {
        icon.textContent = '📷'; label.textContent = 'Tap to take or choose a photo';
        toast('Could not read that photo — try again');
        return;
      }
      compressPhoto(dataUrl, 1000, 0.85, function(compressed) {
        pendingPhoto = compressed;
        icon.textContent = '✅'; label.textContent = 'Photo attached — tap to change';
        var preview = document.getElementById('req-photo-preview');
        preview.src = compressed; preview.style.display = 'block';
      });
    });
  });
};

window.selectReqType = function(type) {
  selectedType = type;
  ['issue','estimate','other'].forEach(function(t){
    document.getElementById('type-'+t).classList.toggle('active', t===type);
  });
};

window.submitRequest = async function() {
  var errEl = document.getElementById('req-err');
  var btn = document.getElementById('req-submit-btn');
  var desc = (document.getElementById('req-description').value || '').trim();
  errEl.textContent = '';
  if (!desc) { errEl.textContent = 'Please describe your request.'; return; }
  if (!pendingPhoto) { errEl.textContent = 'A photo is required for all requests.'; return; }

  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    var email = localStorage.getItem('dl_portal_email') || '';
    var newDoc = await addDoc(collection(db, 'customerRequests'), {
      propId: currentProp.id,
      customerEmail: email,
      type: selectedType,
      description: desc,
      photo: '',
      status: 'new',
      createdAt: new Date().toISOString()
    });

    var storagePath = 'photos/customerRequests/' + newDoc.id + '_' + Date.now() + '.jpg';
    var sref = ref(storage, storagePath);
    await uploadString(sref, pendingPhoto, 'data_url');
    var url = await getDownloadURL(sref);
    await setDoc(doc(db, 'customerRequests', newDoc.id), { photo: url }, { merge: true });

    document.getElementById('new-req-overlay').remove();
    toast('✓ Request submitted');
    loadRequestHistory();
  } catch(e) {
    console.error(e);
    errEl.textContent = 'Could not submit — check your connection and try again.';
    btn.disabled = false; btn.textContent = 'Submit Request';
  }
};

// ── Photo helpers — same validated single-pass pipeline as the main app.
function readFileAsDataUrl(file, callback) {
  var reader = new FileReader();
  reader.onload = function(e) { callback(e.target.result); };
  reader.onerror = function() { callback(null); };
  reader.readAsDataURL(file);
}

function compressPhoto(dataUrl, maxSize, quality, callback) {
  var img = new Image();
  img.onload = function() {
    var canvas = document.createElement('canvas');
    var w = img.width, h = img.height;
    if (w === 0 || h === 0) { callback(dataUrl); return; }
    if (w > maxSize || h > maxSize) {
      if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
      else       { w = Math.round(w * maxSize / h); h = maxSize; }
    }
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, w, h);
    try {
      ctx.drawImage(img, 0, 0, w, h);
      var sample = ctx.getImageData(Math.floor(w*0.3), Math.floor(h*0.3), Math.min(10,w), Math.min(10,h));
      var allWhite = true;
      for (var i = 0; i < sample.data.length; i += 4) {
        if (sample.data[i] < 250 || sample.data[i+1] < 250 || sample.data[i+2] < 250) { allWhite = false; break; }
      }
      if (allWhite) { callback(dataUrl); return; }
      callback(canvas.toDataURL('image/jpeg', quality));
    } catch(e) {
      callback(dataUrl);
    }
  };
  img.onerror = function() { callback(dataUrl); };
  img.src = dataUrl;
}
